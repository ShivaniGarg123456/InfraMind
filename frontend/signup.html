<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InfraMind - Student Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <h1>InfraMind</h1>

        <p>College Complaint Management System</p>

        <h2>Student Sign Up</h2>


        <!-- NAME -->
        <input
            type="text"
            id="name"
            placeholder="Full Name"
        >


        <!-- EMAIL -->
        <input
            type="email"
            id="email"
            placeholder="College Email Address"
        >


        <!-- PASSWORD -->
        <input
            type="password"
            id="password"
            placeholder="Password"
        >


        <!-- CONFIRM PASSWORD -->
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
        >


        <!-- SIGN UP BUTTON -->
        <button
            type="button"
            onclick="signup()"
            id="signupButton"
        >
            Send OTP
        </button>


        <!-- MESSAGE -->
        <p id="signupMessage"></p>


        <p>
            Already have an account?
            <a href="index.html">Login</a>
        </p>

    </div>


    <script>

        async function signup() {

            const name =
                document.getElementById("name").value.trim();

            const email =
                document.getElementById("email").value.trim().toLowerCase();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const signupButton =
                document.getElementById("signupButton");


            // =========================
            // BASIC VALIDATION
            // =========================

            if (
                name === "" ||
                email === "" ||
                password === "" ||
                confirmPassword === ""
            ) {

                showMessage(
                    "Please fill all fields."
                );

                return;
            }


            // =========================
            // NAME VALIDATION
            // Only letters and spaces
            // =========================

            const namePattern =
                /^[A-Za-z]+(?:\s+[A-Za-z]+)*$/;


            if (!namePattern.test(name)) {

                showMessage(
                    "Invalid name. Name should contain only letters and spaces."
                );

                return;
            }


            // =========================
            // MVN EMAIL VALIDATION
            // =========================

            const emailPattern =
                /^[A-Za-z0-9._%+-]+@mvn\.edu\.in$/;


            if (!emailPattern.test(email)) {

                showMessage(
                    "Invalid email. Please use your valid MVN college email."
                );

                return;
            }


            // =========================
            // PASSWORD VALIDATION
            // =========================

            if (password.length < 6) {

                showMessage(
                    "Password must be at least 6 characters."
                );

                return;
            }


            // =========================
            // CONFIRM PASSWORD
            // =========================

            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match."
                );

                return;
            }


            // =========================
            // SEND OTP
            // =========================

            showMessage("Sending OTP...");

            signupButton.disabled = true;
            signupButton.textContent = "Sending...";


            try {

                const response = await fetch(
                    "/send-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            email: email,

                            password: password

                        })
                    }
                );


                // Convert response to JSON
                const data = await response.json();


                // =========================
                // BACKEND ERROR
                // =========================

                if (!response.ok) {

                    showMessage(
                        data.error ||
                        "Failed to send OTP."
                    );

                    signupButton.disabled = false;
                    signupButton.textContent = "Send OTP";

                    return;
                }


                // =========================
                // OTP SUCCESS
                // =========================

                localStorage.setItem(
                    "signupName",
                    name
                );

                localStorage.setItem(
                    "signupEmail",
                    email
                );

                localStorage.setItem(
                    "signupPassword",
                    password
                );


                showMessage(
                    "OTP sent successfully! Check your email."
                );


                // =========================
                // GO TO OTP PAGE
                // =========================

                setTimeout(function () {

                    window.location.href =
                        "verify-otp.html";

                }, 1000);


            }


            catch (error) {

                console.error(
                    "OTP error:",
                    error
                );


                showMessage(
                    "Could not connect to the server."
                );


                signupButton.disabled = false;
                signupButton.textContent = "Send OTP";

            }

        }


        // =========================
        // MESSAGE FUNCTION
        // =========================

        function showMessage(message) {

            document.getElementById(
                "signupMessage"
            ).textContent = message;

        }

    </script>

</body>

</html>
