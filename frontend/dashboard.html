<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraMind - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


<div class="dashboard">

    <h1>Welcome to InfraMind</h1>
    <p>Student Dashboard</p>

    <div class="cards">

        <div class="card">
            <h2 id="totalComplaints">0</h2>
            <p>Total Complaints</p>
        </div>

        <div class="card">
            <h2 id="pendingComplaints">0</h2>
            <p>Pending</p>
        </div>

        <div class="card">
            <h2 id="inProgressComplaints">0</h2>
            <p>In Progress</p>
        </div>

        <div class="card">
            <h2 id="resolvedComplaints">0</h2>
            <p>Resolved</p>
        </div>

    </div>

    <a href="complaint.html" class="complaint-btn">
        Submit Complaint
    </a>

    <a href="my-complaints.html" class="complaint-btn">
        My Complaints
    </a>

    <br>

    <a href="index.html" class="logout-btn">
        Logout
    </a>

</div>

<script>

async function loadDashboard() {

    try {

        const response = await fetch("/my-complaints");

        if (!response.ok) {
            throw new Error("Failed to load complaints");
        }

        const complaints = await response.json();

        document.getElementById("totalComplaints").textContent =
            complaints.length;

        document.getElementById("pendingComplaints").textContent =
            complaints.filter(c => c.status === "Pending").length;

        document.getElementById("inProgressComplaints").textContent =
            complaints.filter(c => c.status === "In Progress").length;

        document.getElementById("resolvedComplaints").textContent =
            complaints.filter(c => c.status === "Resolved").length;

    }
    catch (error) {

        console.error("Dashboard error:", error);

    }
}

loadDashboard();

</script>


</body>
</html>
