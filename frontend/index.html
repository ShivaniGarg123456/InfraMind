<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InfraMind - Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <h1>InfraMind</h1>

        <p>College Complaint Management System</p>

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Student ID / Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="loginUser()">
            Login
        </button>

        <p id="loginMessage"></p>

    </div>


    <script>

        async function loginUser() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            if (username === "" || password === "") {

                showMessage(
                    "Please enter username and password."
                );

                return;
            }


            try {

                const response = await fetch("/login", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        username: username,
                        password: password
                    })

                });


                const data = await response.json();


                if (!response.ok) {

                    showMessage(
                        data.error ||
                        "Invalid username or password."
                    );

                    return;
                }


                // Save role
                localStorage.setItem(
                    "userRole",
                    data.role
                );


                // Student
                if (data.role === "student") {

                    localStorage.setItem(
                        "studentId",
                        data.student_id
                    );

                    window.location.href =
                        "dashboard.html";
                }


                // Admin
                else if (data.role === "admin") {

                    window.location.href =
                        "admin.html";
                }


                // Department
                else if (data.role === "department") {

                    localStorage.setItem(
                        "department",
                        data.department
                    );

                    window.location.href =
                        "department.html";
                }

            }


            catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                showMessage(
                    "Could not connect to the server."
                );
            }

        }


        function showMessage(message) {

            document.getElementById(
                "loginMessage"
            ).textContent = message;

        }

    </script>

</body>

</html>
