
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InfraMind - Department Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="department-container">

    <h1>Department Dashboard</h1>
    <p>Manage assigned complaints</p>

    <div id="complaintContainer">
        <p>Loading complaints...</p>
    </div>

    <a href="admin.html" class="complaint-btn">
        Back to Admin Dashboard
    </a>

    <a href="index.html" class="logout-btn">
        Logout
    </a>

</div>


<script>

    async function loadComplaints() {

        try {
const response = await fetch("/department-complaints");

            if (!response.ok) {
                throw new Error("Failed to load complaints");
            }

            const complaints = await response.json();

            const container =
                document.getElementById("complaintContainer");


            if (complaints.length === 0) {

                container.innerHTML =
                    "<p>No complaints available.</p>";

                return;
            }


            container.innerHTML = "";


            // Show ALL complaints
            complaints.forEach(function(complaint) {

                const card =
                    document.createElement("div");

                card.className = "department-card";


                let statusClass = "status-pending";

                if (complaint.status === "In Progress") {

                    statusClass = "status-progress";

                }
                else if (complaint.status === "Resolved") {

                    statusClass = "status-resolved";

                }
                else if (complaint.status === "Overdue") {

                    statusClass = "status-overdue";

                }
                else if (complaint.status === "Escalated") {

                    statusClass = "status-escalated";

                }


                card.innerHTML = `

                    <h2>${complaint.title}</h2>

                    <p>
                        <strong>Description:</strong>
                        ${complaint.description}
                    </p>

                    <p>
                        <strong>Category:</strong>
                        ${complaint.category}
                    </p>

                    <p>
                        <strong>Department:</strong>
                        ${complaint.department}
                    </p>

                    <p>
                        <strong>Priority:</strong>
                        ${complaint.priority}
                    </p>

                    <p>
                        <strong>Deadline:</strong>
                        ${
                            complaint.deadline
                            ? new Date(
                                complaint.deadline
                              ).toLocaleString()
                            : "N/A"
                        }
                    </p>

                    <p>
                        <strong>Status:</strong>

                        <span
                            id="status-${complaint.id}"
                            class="${statusClass}"
                        >
                            ${complaint.status}
                        </span>

                    </p>


                    <button
                        onclick="updateStatus(${complaint.id}, 'Pending')"
                    >
                        Pending
                    </button>


                    <button
                        onclick="updateStatus(${complaint.id}, 'In Progress')"
                    >
                        In Progress
                    </button>


                    <button
                        onclick="updateStatus(${complaint.id}, 'Resolved')"
                    >
                        Resolved
                    </button>

                `;


                container.appendChild(card);

            });

        }
        catch (error) {

            console.error(error);

            document.getElementById("complaintContainer").innerHTML =
                "<p>Could not load complaints.</p>";

        }

    }



    async function updateStatus(complaintId, status) {

        try {

            const response = await fetch(
                `/complaints/${complaintId}/status`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {

                alert(
                    data.error ||
                    "Failed to update status."
                );

                return;

            }


            // Update only the selected complaint
            const statusElement =
                document.getElementById(
                    `status-${complaintId}`
                );


            statusElement.textContent = status;


            updateStatusStyle(
                statusElement,
                status
            );


            alert(
                "Complaint status updated to " +
                status
            );

        }
        catch (error) {

            console.error(error);

            alert(
                "Could not connect to the backend."
            );

        }

    }



    function updateStatusStyle(
        statusElement,
        status
    ) {

        statusElement.className = "";


        if (status === "Pending") {

            statusElement.classList.add(
                "status-pending"
            );

        }

        else if (status === "In Progress") {

            statusElement.classList.add(
                "status-progress"
            );

        }

        else if (status === "Resolved") {

            statusElement.classList.add(
                "status-resolved"
            );

        }

        else if (status === "Overdue") {

            statusElement.classList.add(
                "status-overdue"
            );

        }

        else if (status === "Escalated") {

            statusElement.classList.add(
                "status-escalated"
            );

        }

    }


    loadComplaints();

</script>

</body>
</html>
