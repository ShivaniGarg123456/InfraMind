<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfraMind - Verify OTP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <h1>InfraMind</h1>
        <p>College Complaint Management System</p>

        <h2>Verify Email</h2>

        <p>Enter the OTP sent to your email address.</p>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
        >

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

        <p id="otpMessage"></p>

        <p>
            <a href="signup.html">Back to Sign Up</a>
        </p>

    </div>

    <script>

        async function verifyOTP() {

            const otp = document
                .getElementById("otp")
                .value
                .trim();

            const email = localStorage.getItem("signupEmail");

            if (!email) {
                showMessage("Signup session not found. Please register again.");
                return;
            }

            if (otp === "") {
                showMessage("Please enter the OTP.");
                return;
            }

            if (otp.length !== 6) {
                showMessage("Please enter a valid 6-digit OTP.");
                return;
            }

            showMessage("Verifying OTP...");

            try {

                const response = await fetch("/verify-otp", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        otp: otp
                    })

                });

                const data = await response.json();

                if (!response.ok) {

                    showMessage(
                        data.error || "Invalid OTP."
                    );

                    return;
                }

                showMessage(
                    "Email verified successfully! Account created."
                );

                // Remove temporary signup data
                localStorage.removeItem("signupName");
                localStorage.removeItem("signupEmail");
                localStorage.removeItem("signupPassword");

                setTimeout(function () {

                    window.location.href = "index.html";

                }, 1500);

            }
            catch (error) {

                console.error(
                    "OTP verification error:",
                    error
                );

                showMessage(
                    "Could not connect to the server."
                );
            }
        }


        function showMessage(message) {

            document.getElementById(
                "otpMessage"
            ).textContent = message;
        }

    </script>

</body>
</html>
